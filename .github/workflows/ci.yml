name: CI

# Qualitäts-Gate für jeden Push auf main und jeden Pull Request:
# Linting, Tests und Produktions-Build müssen grün sein. So landet kein
# kaputter Code im Deploy (Vercel baut parallel, dieser Workflow ist die
# eigentliche Absicherung).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Läuft ein neuer Push, während ein älterer Lauf desselben Branches noch
# arbeitet, wird der alte abgebrochen – spart CI-Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
