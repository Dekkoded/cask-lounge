<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e0b" />
    <meta name="description" content="Cask Lounge – Whiskys entdecken, bewerten, vergleichen und mit deiner Tasting-Gruppe teilen." />
    <link rel="canonical" href="https://casklounge.com/" />
    <title>Cask Lounge – Whisky entdecken & bewerten</title>

    <!-- Open Graph / Teilbarkeit -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cask Lounge" />
    <meta property="og:title" content="Cask Lounge – Whisky entdecken & bewerten" />
    <meta property="og:description" content="Whiskys entdecken, bewerten, vergleichen und mit deiner Tasting-Gruppe teilen." />
    <meta property="og:url" content="https://casklounge.com/" />
    <meta property="og:image" content="https://casklounge.com/icons/icon-512.png" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cask Lounge – Whisky entdecken & bewerten" />
    <meta name="twitter:description" content="Whiskys entdecken, bewerten, vergleichen und mit deiner Tasting-Gruppe teilen." />
    <meta name="twitter:image" content="https://casklounge.com/icons/icon-512.png" />
    <script>
      // Theme vor dem ersten Paint setzen, um Flackern zu vermeiden.
      (function () {
        try {
          if (localStorage.getItem('cl_theme') === 'light') {
            document.documentElement.dataset.theme = 'light'
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#ece8dc')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
