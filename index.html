<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description" content="Tasting-Bewertungen & Gruppen" />
    <title>Cask Lounge</title>
    <script>
      // Theme vor dem ersten Paint setzen, um Flackern zu vermeiden.
      (function () {
        try {
          if (localStorage.getItem('cl_theme') === 'light') {
            document.documentElement.dataset.theme = 'light'
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#fafaf9')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
